naftiko: "1.0.0-alpha1"

info:
  label: "Apple App Store Connect API"
  description: "Consumed definition for the Apple App Store Connect API covering apps, builds, beta testers, and beta groups management."
  tags:
    - Apple
    - App Store
    - TestFlight
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      APPLE_ASC_TOKEN: APPLE_ASC_TOKEN

capability:
  consumes:
    - type: http
      namespace: app-store-connect
      baseUri: https://api.appstoreconnect.apple.com
      description: "Apple App Store Connect REST API for managing apps, builds, and beta testing."
      authentication:
        type: bearer
        token: "{{APPLE_ASC_TOKEN}}"
      resources:
        - name: apps
          path: /v1/apps
          description: "App management operations."
          operations:
            - name: list-apps
              method: GET
              description: "List all apps in App Store Connect."
              inputParameters:
                - name: filter[bundleId]
                  in: query
                  type: string
                  required: false
                  description: "Filter by bundle identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: read-app
              method: GET
              description: "Get details of a specific app."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The app resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: modify-app
              method: PATCH
              description: "Update an app's metadata."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The app resource ID."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: builds
          path: /v1/builds
          description: "Build management operations."
          operations:
            - name: list-builds
              method: GET
              description: "List all builds."
              inputParameters:
                - name: filter[app]
                  in: query
                  type: string
                  required: false
                  description: "Filter by app resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: read-build
              method: GET
              description: "Get details of a specific build."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The build resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: modify-build
              method: PATCH
              description: "Update build information."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The build resource ID."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: beta-testers
          path: /v1/betaTesters
          description: "Beta tester management."
          operations:
            - name: list-beta-testers
              method: GET
              description: "List all beta testers."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-beta-tester
              method: POST
              description: "Create a new beta tester."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: read-beta-tester
              method: GET
              description: "Get details of a beta tester."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The beta tester resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-beta-tester
              method: DELETE
              description: "Remove a beta tester."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The beta tester resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: beta-groups
          path: /v1/betaGroups
          description: "Beta group management."
          operations:
            - name: list-beta-groups
              method: GET
              description: "List all beta groups."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-beta-group
              method: POST
              description: "Create a new beta group."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: read-beta-group
              method: GET
              description: "Get details of a beta group."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The beta group resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: modify-beta-group
              method: PATCH
              description: "Update a beta group."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The beta group resource ID."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-beta-group
              method: DELETE
              description: "Delete a beta group."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The beta group resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: mcp
      port: 9100
      namespace: app-store-connect-mcp
      transport: http
      tools:
        - name: list-apps
          description: "List all apps."
          hints:
            readOnly: true
          call: "app-store-connect.list-apps"
          outputParameters:
            - type: object
              mapping: "$."
        - name: read-app
          description: "Get app details."
          hints:
            readOnly: true
          call: "app-store-connect.read-app"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-builds
          description: "List all builds."
          hints:
            readOnly: true
          call: "app-store-connect.list-builds"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-beta-testers
          description: "List beta testers."
          hints:
            readOnly: true
          call: "app-store-connect.list-beta-testers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-beta-tester
          description: "Add a beta tester."
          hints:
            readOnly: false
          call: "app-store-connect.create-beta-tester"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-beta-tester
          description: "Remove a beta tester."
          hints:
            destructive: true
          call: "app-store-connect.delete-beta-tester"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-beta-groups
          description: "List beta groups."
          hints:
            readOnly: true
          call: "app-store-connect.list-beta-groups"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-beta-group
          description: "Create a beta group."
          hints:
            readOnly: false
          call: "app-store-connect.create-beta-group"
          outputParameters:
            - type: object
              mapping: "$."
