# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

interface Node {
  id: ID!
}

interface Localizable {
  locale: String!
}

# ---------------------------------------------------------------------------
# App Management Types
# ---------------------------------------------------------------------------

type App implements Node {
  id: ID!
  name: String!
  bundleId: String!
  sku: String
  primaryLocale: String
  isOrEverWasMadeForKids: Boolean
  subscriptionStatusUrl: URL
  subscriptionStatusUrlVersion: String
  contentRightsDeclaration: String
  reviewSubmissionsUrl: URL
  ageRating: AgeRating
  availableInNewTerritories: Boolean
  versions(state: AppStoreState): [AppVersion!]
  latestVersion: AppVersion
  builds(processingState: BuildProcessingState): [Build!]
  betaGroups: [BetaGroup!]
  betaTesters: [BetaTester!]
  inAppPurchases(type: InAppPurchaseType): [InAppPurchase!]
  subscriptionGroups: [SubscriptionGroup!]
  categories: AppCategoryAssignment
  availability: AppAvailability
  prices: [AppPrice!]
  reviewSubmissions: [ReviewSubmission!]
  appClips: [AppClip!]
  gameCenter: GameCenter
  analyticsReports: [AnalyticsReport!]
  relationships: AppRelationship
}

type AppVersion implements Node {
  id: ID!
  versionString: String!
  platform: Platform!
  appStoreState: AppStoreState
  releaseType: String
  earliestReleaseDate: DateTime
  usesIdfa: Boolean
  downloadable: Boolean
  createdDate: DateTime
  app: App
  localizations: [AppVersionLocalization!]
  build: Build
  ageRatingDeclaration: AgeRatingDeclaration
  routingAppCoverage: RoutingAppCoverage
  reviewSubmission: ReviewSubmission
  appVersionExperiments: [AppVersionExperiment!]
}

type AppVersionLocalization implements Node & Localizable {
  id: ID!
  locale: String!
  description: String
  keywords: String
  marketingUrl: URL
  promotionalText: String
  supportUrl: URL
  whatsNew: String
  screenshots(displayType: ScreenshotDisplayType): [AppScreenshot!]
  previews: [AppPreview!]
}

type AppCategoryAssignment {
  primary: AppCategory
  secondary: AppCategory
}

type AppCategory implements Node {
  id: ID!
  name: String!
  platforms: [Platform!]
  subcategories: [AppCategory!]
  parent: AppCategory
}

type AppRelationship {
  app: App!
  versions: [AppVersion!]
  builds: [Build!]
  betaGroups: [BetaGroup!]
  subscriptionGroups: [SubscriptionGroup!]
