# ---------------------------------------------------------------------------
# Query Root
# ---------------------------------------------------------------------------

type Query {
  # App Management
  app(id: ID!): App
  apps(bundleId: String, sku: String, name: String): [App!]
  appVersion(id: ID!): AppVersion
  appCategory(id: ID!): AppCategory
  appCategories(platforms: [Platform!]): [AppCategory!]

  # Pricing
  appPriceTier(id: ID!): AppPriceTier
  appPriceTiers: [AppPriceTier!]
  appPricePoint(id: ID!): AppPricePoint

  # Bundles
  bundle(id: ID!): Bundle
  bundleId(id: ID!): BundleId
  bundleIds(identifier: String, platform: Platform): [BundleId!]

  # Certificates and Profiles
  certificate(id: ID!): Certificate
  certificates(type: CertificateType, displayName: String): [Certificate!]
  device(id: ID!): Device
  devices(name: String, platform: Platform, udid: String): [Device!]
  profile(id: ID!): Profile
  profiles(name: String, profileType: ProfileType, profileState: ProfileState): [Profile!]

  # Builds and Beta Testing
  build(id: ID!): Build
  builds(app: ID, processingState: BuildProcessingState, version: String): [Build!]
  betaGroup(id: ID!): BetaGroup
  betaGroups(app: ID, name: String, isInternalGroup: Boolean): [BetaGroup!]
  betaTester(id: ID!): BetaTester
  betaTesters(email: String, firstName: String, lastName: String): [BetaTester!]
  preReleaseVersion(id: ID!): PreReleaseVersion

  # App Review
  reviewSubmission(id: ID!): ReviewSubmission
  appReview(id: ID!): AppReview
  reviews(app: ID!, territory: String): [Review!]
  ratingSummary(app: ID!, territory: String): RatingSummary

  # In-App Purchases and Subscriptions
  inAppPurchase(id: ID!): InAppPurchase
  subscription(id: ID!): Subscription
  subscriptionGroup(id: ID!): SubscriptionGroup

  # Analytics and Reports
  analyticsReportRequest(id: ID!): AnalyticsReportRequest
  analyticsReport(id: ID!): AnalyticsReport
  financeReports(vendorNumber: String!, reportDate: String!, frequency: String): [FinanceReport!]
  salesReports(vendorNumber: String!, reportDate: String!, frequency: String, reportType: String): [SalesReport!]

  # Users and Roles
  users: [User!]
  user(id: ID!): User
  userInvitations: [UserInvitation!]
  userInvitation(id: ID!): UserInvitation

  # Territories
  territories: [Territory!]
  territory(id: ID!): Territory

  # Game Center
  gameCenterDetail(id: ID!): GameCenterDetail
  gameCenterGroup(id: ID!): GameCenterGroup
  achievement(id: ID!): Achievement
  leaderboard(id: ID!): Leaderboard
  leaderboardSet(id: ID!): LeaderboardSet

  # Maps
  geocode(q: String!, lang: String, limitToCountries: String): [GeocodedPlace!]
  reverseGeocode(loc: String!, lang: String): [GeocodedPlace!]
  search(q: String!, lang: String, userLocation: String, limitToCountries: String): [SearchResult!]
  eta(origin: String!, destinations: [String!]!, transportType: String): [EtaResult!]

  # App Clips
  appClip(id: ID!): AppClip
  appClipDefaultExperience(id: ID!): AppClipDefaultExperience

  # Sign in with Apple
  validateAppleToken(idToken: String!): AppleIdentityToken

  # DeviceCheck
  deviceCheckBits(deviceToken: String!, timestamp: Int!): DeviceCheckBits
}

# ---------------------------------------------------------------------------
# Mutation Root
# ---------------------------------------------------------------------------

type Mutation {
  # App Management
  updateApp(id: ID!, name: String, primaryLocale: String, subscriptionStatusUrl: URL): App
  createAppVersion(appId: ID!, versionString: String!, platform: Platform!): AppVersion
  updateAppVersion(id: ID!, versionString: String, earliestReleaseDate: DateTime): AppVersion
  createAppVersionLocalization(appVersionId: ID!, locale: String!, description: String, keywords: String): AppVersionLocalization
  updateAppVersionLocalization(id: ID!, description: String, keywords: String, whatsNew: String): AppVersionLocalization

  # Beta Testing
  createBetaGroup(appId: ID!, name: String!, isInternalGroup: Boolean, feedbackEnabled: Boolean): BetaGroup
  updateBetaGroup(id: ID!, name: String, publicLinkEnabled: Boolean, publicLinkLimit: Int): BetaGroup
  deleteBetaGroup(id: ID!): Boolean
  addBetaTesters(betaGroupId: ID!, emails: [String!]!): BetaGroup
  removeBetaTesters(betaGroupId: ID!, emails: [String!]!): BetaGroup
  addBuilds(betaGroupId: ID!, buildIds: [ID!]!): BetaGroup

  # Review Submission
  createReviewSubmission(appId: ID!, platform: Platform!): ReviewSubmission
  cancelReviewSubmission(id: ID!): ReviewSubmission
  createAppReviewResponse(reviewId: ID!, responseBody: String!): AppReviewResponse
  deleteAppReviewResponse(id: ID!): Boolean

  # Certificates and Profiles
  createCertificate(type: CertificateType!, csrContent: String!): Certificate
  revokeCertificate(id: ID!): Boolean
  registerDevice(name: String!, platform: Platform!, udid: String!): Device
  enableDevice(id: ID!): Device
  createProfile(name: String!, profileType: ProfileType!, bundleIdId: ID!, certificateIds: [ID!]!, deviceIds: [ID!]): Profile
  deleteProfile(id: ID!): Boolean
  registerBundleId(identifier: String!, name: String!, platform: Platform!): BundleId
  deleteBundleId(id: ID!): Boolean

  # In-App Purchases
  createInAppPurchase(appId: ID!, name: String!, productId: String!, inAppPurchaseType: InAppPurchaseType!): InAppPurchase
  updateInAppPurchase(id: ID!, name: String, reviewNote: String): InAppPurchase
  deleteInAppPurchase(id: ID!): Boolean
  createSubscription(groupId: ID!, name: String!, productId: String!, subscriptionPeriod: SubscriptionPeriod!): Subscription
  createSubscriptionGroup(appId: ID!, referenceName: String!): SubscriptionGroup

  # Users
  inviteUser(email: String!, firstName: String, lastName: String, roles: [UserRole!]!, allAppsVisible: Boolean, provisioningAllowed: Boolean, visibleAppIds: [ID!]): UserInvitation
  updateUser(id: ID!, roles: [UserRole!], allAppsVisible: Boolean, provisioningAllowed: Boolean, visibleAppIds: [ID!]): User
  removeUser(id: ID!): Boolean
  cancelUserInvitation(id: ID!): Boolean

  # Game Center
  createAchievement(gameCenterDetailId: ID!, referenceName: String!, vendorIdentifier: String!, points: Int!): Achievement
  updateAchievement(id: ID!, points: Int, showBeforeEarned: Boolean, repeatable: Boolean): Achievement
  createLeaderboard(gameCenterDetailId: ID!, referenceName: String!, vendorIdentifier: String!, scoreSortType: String!): Leaderboard
  updateLeaderboard(id: ID!, referenceName: String, scoreSortType: String): Leaderboard

  # DeviceCheck
  setDeviceCheckBits(deviceToken: String!, timestamp: Int!, bit0: Boolean, bit1: Boolean): Boolean
}
