        example: []
      - name: filter[id]
        in: query
        description: Filter by build resource ID
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[version]
        in: query
        description: Filter by build version string
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[expired]
        in: query
        description: Filter by expiration status
        schema:
          type: array
          items:
            type: string
