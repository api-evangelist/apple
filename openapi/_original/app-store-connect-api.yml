        schema:
          type: array
          items:
            type: string
            enum:
            - app
            - appEncryptionDeclaration
            - appStoreVersion
            - betaAppReviewSubmission
            - betaBuildLocalizations
            - betaGroups
            - buildBetaDetail
            - buildBundles
            - icons
            - individualTesters
            - preReleaseVersion
        style: form
