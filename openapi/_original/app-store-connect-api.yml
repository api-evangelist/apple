openapi: 3.1.0
info:
  title: Apple App Store Connect API
  description: >-
    Automate the tasks you perform on the Apple Developer website and in App
    Store Connect. The App Store Connect API is a REST API that enables the
    automation of actions you take in App Store Connect, including managing
    apps, builds, beta testers, provisioning, and more. This specification
    covers the Apps, Builds, and Beta Testers resource groups.
  version: 3.6.0
  contact:
    name: Apple Developer Relations
    url: https://developer.apple.com/contact/
    email: developer@apple.com
  license:
    name: Apple Developer Program License Agreement
    url: https://developer.apple.com/support/terms/apple-developer-program-license-agreement/
  termsOfService: https://developer.apple.com/terms/
  x-providerName: Apple
  x-serviceName: App Store Connect

externalDocs:
  description: Apple App Store Connect API Documentation
  url: https://developer.apple.com/documentation/appstoreconnectapi

servers:
- url: https://api.appstoreconnect.apple.com
  description: App Store Connect API Production Server

security:
- BearerAuth: []

tags:
- name: Apps
  description: >-
    Manage your apps in App Store Connect, including app metadata, pricing,
    availability, and app information.
  externalDocs:
    url: https://developer.apple.com/documentation/appstoreconnectapi/apps
- name: Builds
  description: >-
    Manage builds uploaded to App Store Connect, including build metadata,
    processing state, and build relationships.
  externalDocs:
    url: https://developer.apple.com/documentation/appstoreconnectapi/builds
- name: Beta Testers
  description: >-
    Manage TestFlight beta testers, including inviting testers, managing
    tester groups, and controlling access to beta builds.
  externalDocs:
    url: https://developer.apple.com/documentation/appstoreconnectapi/beta-testers

paths:
  /v1/apps:
    get:
      operationId: listApps
      summary: List Apps
      description: >-
        Find and list apps in App Store Connect. Returns a paginated list of
        apps associated with your Apple Developer account.
      tags:
      - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-apps
      parameters:
      - name: filter[bundleId]
        in: query
        description: Filter by bundle identifier
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[id]
        in: query
        description: Filter by app resource ID
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[name]
        in: query
        description: Filter by app name
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[sku]
        in: query
        description: Filter by SKU
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[appStoreVersions.platform]
        in: query
        description: Filter by platform
        schema:
          type: array
          items:
            type: string
            enum:
            - IOS
            - MAC_OS
            - TV_OS
            - VISION_OS
        style: form
        explode: false
        example: []
      - name: filter[appStoreVersions.appStoreState]
        in: query
        description: Filter by App Store version state
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - DEVELOPER_REJECTED
            - DEVELOPER_REMOVED_FROM_SALE
            - IN_REVIEW
            - INVALID_BINARY
            - METADATA_REJECTED
            - PENDING_APPLE_RELEASE
            - PENDING_DEVELOPER_RELEASE
            - PREPARE_FOR_SUBMISSION
            - PREORDER_READY_FOR_SALE
            - PROCESSING_FOR_APP_STORE
            - READY_FOR_REVIEW
            - READY_FOR_SALE
            - REJECTED
            - REMOVED_FROM_SALE
            - REPLACED_WITH_NEW_VERSION
            - WAITING_FOR_EXPORT_COMPLIANCE
            - WAITING_FOR_REVIEW
        style: form
        explode: false
        example: []
      - name: sort
        in: query
        description: Sort order for the results
        schema:
          type: array
          items:
            type: string
            enum:
            - bundleId
            - -bundleId
            - name
            - -name
            - sku
            - -sku
        style: form
        explode: false
        example: []
      - name: fields[apps]
        in: query
        description: Fields to return for app resources
        schema:
          type: array
          items:
            type: string
            enum:
            - alternativeDistributionKey
            - analyticsReportRequests
            - appAvailability
            - appClips
            - appCustomProductPages
            - appEncryptionDeclarations
            - appEvents
            - appInfos
            - appPricePoints
            - appPriceSchedule
            - appStoreVersionExperimentsV2
            - appStoreVersions
            - betaAppLocalizations
            - betaAppReviewDetail
            - betaGroups
            - betaLicenseAgreement
            - betaTesters
            - builds
            - bundleId
            - ciProduct
            - contentRightsDeclaration
            - customerReviews
            - endUserLicenseAgreement
            - gameCenterDetail
            - gameCenterEnabledVersions
            - inAppPurchases
            - inAppPurchasesV2
            - isOrEverWasMadeForKids
            - marketplaceSearchDetail
            - name
            - perfPowerMetrics
            - preOrder
            - preReleaseVersions
            - primaryLocale
            - promotedPurchases
            - reviewSubmissions
            - sku
            - streamlinedPurchasingEnabled
            - subscriptionGracePeriod
            - subscriptionGroups
            - subscriptionStatusUrl
            - subscriptionStatusUrlForSandbox
            - subscriptionStatusUrlVersion
            - subscriptionStatusUrlVersionForSandbox
        style: form
        explode: false
        example: []
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
              examples:
                Listapps200Example:
                  summary: Default listApps 200 response
                  x-microcks-default: true
                  value:
                    data:
                    - type: apps
                      id: abc123
                    included: []
                    links:
                      self: https://www.example.com
                      first: https://www.example.com
                      next: https://www.example.com
                    meta:
                      paging:
                        total: 10
                        limit: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/apps/{id}:
    get:
      operationId: readApp
      summary: Read App Information
      description: Get information about a specific app.
      tags:
      - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/read-app-information
      parameters:
      - $ref: '#/components/parameters/AppIdParam'
      - name: fields[apps]
        in: query
        description: Fields to return for app resources
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: include
        in: query
        description: Relationship data to include in the response
        schema:
          type: array
          items:
            type: string
            enum:
            - appClips
            - appCustomProductPages
            - appEncryptionDeclarations
            - appEvents
            - appInfos
            - appStoreVersionExperimentsV2
            - appStoreVersions
            - betaAppLocalizations
            - betaAppReviewDetail
            - betaGroups
            - betaLicenseAgreement
            - builds
            - ciProduct
            - endUserLicenseAgreement
            - gameCenterDetail
            - gameCenterEnabledVersions
            - inAppPurchases
            - inAppPurchasesV2
            - preOrder
            - preReleaseVersions
            - promotedPurchases
            - reviewSubmissions
            - subscriptionGracePeriod
            - subscriptionGroups
        style: form
        explode: false
        example: []
      responses:
        '200':
          description: Single app response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
              examples:
                Readapp200Example:
                  summary: Default readApp 200 response
                  x-microcks-default: true
                  value:
                    data:
                      type: apps
                      id: abc123
                    included: []
                    links:
                      self: https://www.example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    patch:
      operationId: modifyApp
      summary: Modify an App
      description: Update app information including app-level attributes.
      tags:
      - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/modify-an-app
      parameters:
      - $ref: '#/components/parameters/AppIdParam'
      requestBody:
        description: App update request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdateRequest'
            examples:
              ModifyappRequestExample:
                summary: Default modifyApp request
                x-microcks-default: true
                value:
                  data:
                    type: apps
                    id: abc123
                    attributes:
                      contentRightsDeclaration: DOES_NOT_USE_THIRD_PARTY_CONTENT
                      subscriptionStatusUrl: https://www.example.com
                      subscriptionStatusUrlForSandbox: https://www.example.com
                      subscriptionStatusUrlVersion: V1
                      subscriptionStatusUrlVersionForSandbox: V1
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
              examples:
                Modifyapp200Example:
                  summary: Default modifyApp 200 response
                  x-microcks-default: true
                  value:
                    data:
                      type: apps
                      id: abc123
                    included: []
                    links:
                      self: https://www.example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/apps/{id}/builds:
    get:
      operationId: listAppBuilds
      summary: List All Builds of an App
      description: Get a list of builds associated with a specific app.
      tags:
      - Apps
      - Builds
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-all-builds-of-an-app
      parameters:
      - $ref: '#/components/parameters/AppIdParam'
      - name: fields[builds]
        in: query
        description: Fields to return for build resources
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of builds for the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildsResponse'
              examples:
                Listappbuilds200Example:
                  summary: Default listAppBuilds 200 response
                  x-microcks-default: true
                  value:
                    data:
                    - type: builds
                      id: abc123
                    included: []
                    links:
                      self: https://www.example.com
                      first: https://www.example.com
                      next: https://www.example.com
                    meta:
                      paging:
                        total: 10
                        limit: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/builds:
