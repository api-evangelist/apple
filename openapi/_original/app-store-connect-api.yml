            - -state
        style: form
        explode: false
        example: []
      - name: fields[betaTesters]
        in: query
        description: Fields to return for beta tester resources
        schema:
          type: array
          items:
            type: string
            enum:
            - apps
            - betaGroups
            - builds
            - email
            - firstName
            - inviteType
            - lastName
