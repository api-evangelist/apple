                        limit: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/betaTesters:
    get:
      operationId: listBetaTesters
      summary: List Beta Testers
      description: >-
        Find and list beta testers for all apps, builds, and beta groups.
      tags:
      - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-beta-testers
      parameters:
      - name: filter[email]
        in: query
        description: Filter by email address
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: user@example.com
      - name: filter[firstName]
        in: query
        description: Filter by first name
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[lastName]
        in: query
        description: Filter by last name
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[inviteType]
        in: query
        description: Filter by invitation type
        schema:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - PUBLIC_LINK
        style: form
        explode: false
        example: []
      - name: filter[apps]
        in: query
        description: Filter by app resource IDs
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: []
      - name: filter[betaGroups]
        in: query
        description: Filter by beta group resource IDs
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
