openapi: 3.1.0
info:
  title: Apple App Store Connect API
  description: >-
    Automate the tasks you perform on the Apple Developer website and in App
    Store Connect. The App Store Connect API is a REST API that enables the
    automation of actions you take in App Store Connect, including managing
    apps, builds, beta testers, provisioning, and more. This specification
    covers the Apps, Builds, and Beta Testers resource groups.
  version: 3.6.0
  contact:
    name: Apple Developer Relations
    url: https://developer.apple.com/contact/
    email: developer@apple.com
  license:
    name: Apple Developer Program License Agreement
    url: https://developer.apple.com/support/terms/apple-developer-program-license-agreement/
  termsOfService: https://developer.apple.com/terms/
  x-providerName: Apple
  x-serviceName: App Store Connect

externalDocs:
  description: Apple App Store Connect API Documentation
  url: https://developer.apple.com/documentation/appstoreconnectapi

servers:
  - url: https://api.appstoreconnect.apple.com
    description: App Store Connect API Production Server

security:
  - BearerAuth: []

tags:
  - name: Apps
    description: >-
      Manage your apps in App Store Connect, including app metadata, pricing,
      availability, and app information.
    externalDocs:
      url: https://developer.apple.com/documentation/appstoreconnectapi/apps
  - name: Builds
    description: >-
      Manage builds uploaded to App Store Connect, including build metadata,
      processing state, and build relationships.
    externalDocs:
      url: https://developer.apple.com/documentation/appstoreconnectapi/builds
  - name: Beta Testers
    description: >-
      Manage TestFlight beta testers, including inviting testers, managing
      tester groups, and controlling access to beta builds.
    externalDocs:
      url: https://developer.apple.com/documentation/appstoreconnectapi/beta-testers

paths:
  /v1/apps:
    get:
      operationId: listApps
      summary: List Apps
      description: >-
        Find and list apps in App Store Connect. Returns a paginated list of
        apps associated with your Apple Developer account.
      tags:
        - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-apps
      parameters:
        - name: filter[bundleId]
          in: query
          description: Filter by bundle identifier
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[id]
          in: query
          description: Filter by app resource ID
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[name]
          in: query
          description: Filter by app name
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[sku]
          in: query
          description: Filter by SKU
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[appStoreVersions.platform]
          in: query
          description: Filter by platform
          schema:
            type: array
            items:
              type: string
              enum:
                - IOS
                - MAC_OS
                - TV_OS
                - VISION_OS
          style: form
          explode: false
        - name: filter[appStoreVersions.appStoreState]
          in: query
          description: Filter by App Store version state
          schema:
            type: array
            items:
              type: string
              enum:
                - ACCEPTED
                - DEVELOPER_REJECTED
                - DEVELOPER_REMOVED_FROM_SALE
                - IN_REVIEW
                - INVALID_BINARY
                - METADATA_REJECTED
                - PENDING_APPLE_RELEASE
                - PENDING_DEVELOPER_RELEASE
                - PREPARE_FOR_SUBMISSION
                - PREORDER_READY_FOR_SALE
                - PROCESSING_FOR_APP_STORE
                - READY_FOR_REVIEW
                - READY_FOR_SALE
                - REJECTED
                - REMOVED_FROM_SALE
                - REPLACED_WITH_NEW_VERSION
                - WAITING_FOR_EXPORT_COMPLIANCE
                - WAITING_FOR_REVIEW
          style: form
          explode: false
        - name: sort
          in: query
          description: Sort order for the results
          schema:
            type: array
            items:
              type: string
              enum:
                - bundleId
                - -bundleId
                - name
                - -name
                - sku
                - -sku
          style: form
          explode: false
        - name: fields[apps]
          in: query
          description: Fields to return for app resources
          schema:
            type: array
            items:
              type: string
              enum:
                - alternativeDistributionKey
                - analyticsReportRequests
                - appAvailability
                - appClips
                - appCustomProductPages
                - appEncryptionDeclarations
                - appEvents
                - appInfos
                - appPricePoints
                - appPriceSchedule
                - appStoreVersionExperimentsV2
                - appStoreVersions
                - betaAppLocalizations
                - betaAppReviewDetail
                - betaGroups
                - betaLicenseAgreement
                - betaTesters
                - builds
                - bundleId
                - ciProduct
                - contentRightsDeclaration
                - customerReviews
                - endUserLicenseAgreement
                - gameCenterDetail
                - gameCenterEnabledVersions
                - inAppPurchases
                - inAppPurchasesV2
                - isOrEverWasMadeForKids
                - marketplaceSearchDetail
                - name
                - perfPowerMetrics
                - preOrder
                - preReleaseVersions
                - primaryLocale
                - promotedPurchases
                - reviewSubmissions
                - sku
                - streamlinedPurchasingEnabled
                - subscriptionGracePeriod
                - subscriptionGroups
                - subscriptionStatusUrl
                - subscriptionStatusUrlForSandbox
                - subscriptionStatusUrlVersion
                - subscriptionStatusUrlVersionForSandbox
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/apps/{id}:
    get:
      operationId: readApp
      summary: Read App Information
      description: Get information about a specific app.
      tags:
        - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/read-app-information
      parameters:
        - $ref: '#/components/parameters/AppIdParam'
        - name: fields[apps]
          in: query
          description: Fields to return for app resources
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: include
          in: query
          description: Relationship data to include in the response
          schema:
            type: array
            items:
              type: string
              enum:
                - appClips
                - appCustomProductPages
                - appEncryptionDeclarations
                - appEvents
                - appInfos
                - appStoreVersionExperimentsV2
                - appStoreVersions
                - betaAppLocalizations
                - betaAppReviewDetail
                - betaGroups
                - betaLicenseAgreement
                - builds
                - ciProduct
                - endUserLicenseAgreement
                - gameCenterDetail
                - gameCenterEnabledVersions
                - inAppPurchases
                - inAppPurchasesV2
                - preOrder
                - preReleaseVersions
                - promotedPurchases
                - reviewSubmissions
                - subscriptionGracePeriod
                - subscriptionGroups
          style: form
          explode: false
      responses:
        '200':
          description: Single app response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: modifyApp
      summary: Modify an App
      description: Update app information including app-level attributes.
      tags:
        - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/modify-an-app
      parameters:
        - $ref: '#/components/parameters/AppIdParam'
      requestBody:
        description: App update request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdateRequest'
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/apps/{id}/builds:
    get:
      operationId: listAppBuilds
      summary: List All Builds of an App
      description: Get a list of builds associated with a specific app.
      tags:
        - Apps
        - Builds
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-all-builds-of-an-app
      parameters:
        - $ref: '#/components/parameters/AppIdParam'
        - name: fields[builds]
          in: query
          description: Fields to return for build resources
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of builds for the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/builds:
    get:
      operationId: listBuilds
      summary: List Builds
      description: >-
        Find and list builds for all apps in App Store Connect. Returns a
        paginated list of builds.
      tags:
        - Builds
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-builds
      parameters:
        - name: filter[app]
          in: query
          description: Filter by app resource ID
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[id]
          in: query
          description: Filter by build resource ID
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[version]
          in: query
          description: Filter by build version string
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[expired]
          in: query
          description: Filter by expiration status
          schema:
            type: array
            items:
              type: string
              enum:
                - 'true'
                - 'false'
          style: form
          explode: false
        - name: filter[processingState]
          in: query
          description: Filter by processing state
          schema:
            type: array
            items:
              type: string
              enum:
                - PROCESSING
                - FAILED
                - INVALID
                - VALID
          style: form
          explode: false
        - name: filter[preReleaseVersion.platform]
          in: query
          description: Filter by platform
          schema:
            type: array
            items:
              type: string
              enum:
                - IOS
                - MAC_OS
                - TV_OS
                - VISION_OS
          style: form
          explode: false
        - name: filter[preReleaseVersion.version]
          in: query
          description: Filter by pre-release version string
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[betaGroups]
          in: query
          description: Filter by beta group IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[usesNonExemptEncryption]
          in: query
          description: Filter by encryption usage
          schema:
            type: array
            items:
              type: string
              enum:
                - 'true'
                - 'false'
          style: form
          explode: false
        - name: sort
          in: query
          description: Sort order for results
          schema:
            type: array
            items:
              type: string
              enum:
                - preReleaseVersion
                - -preReleaseVersion
                - uploadedDate
                - -uploadedDate
                - version
                - -version
          style: form
          explode: false
        - name: fields[builds]
          in: query
          description: Fields to return for build resources
          schema:
            type: array
            items:
              type: string
              enum:
                - app
                - appEncryptionDeclaration
                - appStoreVersion
                - betaAppReviewSubmission
                - betaBuildLocalizations
                - betaGroups
                - buildAudienceType
                - buildBetaDetail
                - buildBundles
                - computedMinMacOsVersion
                - diagnosticSignatures
                - expirationDate
                - expired
                - iconAssetToken
                - icons
                - individualTesters
                - lsMinimumSystemVersion
                - minOsVersion
                - perfPowerMetrics
                - preReleaseVersion
                - processingState
                - uploadedDate
                - usesNonExemptEncryption
                - version
          style: form
          explode: false
        - name: include
          in: query
          description: Relationship data to include in the response
          schema:
            type: array
            items:
              type: string
              enum:
                - app
                - appEncryptionDeclaration
                - appStoreVersion
                - betaAppReviewSubmission
                - betaBuildLocalizations
                - betaGroups
                - buildBetaDetail
                - buildBundles
                - icons
                - individualTesters
                - preReleaseVersion
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of builds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/builds/{id}:
    get:
      operationId: readBuild
      summary: Read Build Information
      description: Get information about a specific build.
      tags:
        - Builds
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/read-build-information
      parameters:
        - $ref: '#/components/parameters/BuildIdParam'
        - name: fields[builds]
          in: query
          description: Fields to return for build resources
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: include
          in: query
          description: Relationship data to include in the response
          schema:
            type: array
            items:
              type: string
              enum:
                - app
                - appEncryptionDeclaration
                - appStoreVersion
                - betaAppReviewSubmission
                - betaBuildLocalizations
                - betaGroups
                - buildBetaDetail
                - buildBundles
                - icons
                - individualTesters
                - preReleaseVersion
          style: form
          explode: false
      responses:
        '200':
          description: Single build response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: modifyBuild
      summary: Modify a Build
      description: >-
        Expire a build or change its encryption exemption setting.
      tags:
        - Builds
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/modify-a-build
      parameters:
        - $ref: '#/components/parameters/BuildIdParam'
      requestBody:
        description: Build update request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildUpdateRequest'
      responses:
        '200':
          description: Updated build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/builds/{id}/individualTesters:
    get:
      operationId: listBuildIndividualTesters
      summary: List All Individual Testers for a Build
      description: Get a list of beta testers individually assigned to a build.
      tags:
        - Builds
        - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-all-individual-testers-for-a-build
      parameters:
        - $ref: '#/components/parameters/BuildIdParam'
        - name: fields[betaTesters]
          in: query
          description: Fields to return for beta tester resources
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of beta testers for the build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaTestersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/betaTesters:
    get:
      operationId: listBetaTesters
      summary: List Beta Testers
      description: >-
        Find and list beta testers for all apps, builds, and beta groups.
      tags:
        - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-beta-testers
      parameters:
        - name: filter[email]
          in: query
          description: Filter by email address
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[firstName]
          in: query
          description: Filter by first name
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[lastName]
          in: query
          description: Filter by last name
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[inviteType]
          in: query
          description: Filter by invitation type
          schema:
            type: array
            items:
              type: string
              enum:
                - EMAIL
                - PUBLIC_LINK
          style: form
          explode: false
        - name: filter[apps]
          in: query
          description: Filter by app resource IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[betaGroups]
          in: query
          description: Filter by beta group resource IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[builds]
          in: query
          description: Filter by build resource IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filter[id]
          in: query
          description: Filter by beta tester resource ID
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: sort
          in: query
          description: Sort order for results
          schema:
            type: array
            items:
              type: string
              enum:
                - email
                - -email
                - firstName
                - -firstName
                - inviteType
                - -inviteType
                - lastName
                - -lastName
                - state
                - -state
          style: form
          explode: false
        - name: fields[betaTesters]
          in: query
          description: Fields to return for beta tester resources
          schema:
            type: array
            items:
              type: string
              enum:
                - apps
                - betaGroups
                - builds
                - email
                - firstName
                - inviteType
                - lastName
                - state
          style: form
          explode: false
        - name: include
          in: query
          description: Relationship data to include in the response
          schema:
            type: array
            items:
              type: string
              enum:
                - apps
                - betaGroups
                - builds
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of beta testers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaTestersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createBetaTester
      summary: Create a Beta Tester
      description: >-
        Create a beta tester assigned to a group, a build, or an app.
      tags:
        - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/create-a-beta-tester
      requestBody:
        description: Beta tester creation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetaTesterCreateRequest'
      responses:
        '201':
          description: Created beta tester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaTesterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/betaTesters/{id}:
    get:
      operationId: readBetaTester
      summary: Read Beta Tester Information
      description: Get information about a specific beta tester.
      tags:
        - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/read-beta-tester-information
      parameters:
        - $ref: '#/components/parameters/BetaTesterIdParam'
        - name: fields[betaTesters]
          in: query
          description: Fields to return for beta tester resources
          schema:
            type: array
            items:
              type: string
              enum:
                - apps
                - betaGroups
                - builds
                - email
                - firstName
                - inviteType
                - lastName
                - state
          style: form
          explode: false
        - name: include
          in: query
          description: Relationship data to include in the response
          schema:
            type: array
            items:
              type: string
              enum:
                - apps
                - betaGroups
                - builds
          style: form
          explode: false
      responses:
        '200':
          description: Single beta tester response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaTesterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBetaTester
      summary: Delete a Beta Tester
      description: >-
        Remove a beta tester's ability to test all apps.
      tags:
        - Beta Testers
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/delete-a-beta-tester
      parameters:
        - $ref: '#/components/parameters/BetaTesterIdParam'
      responses:
        '204':
          description: Beta tester successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/betaTesters/{id}/apps:
    get:
      operationId: listBetaTesterApps
      summary: List All Apps for a Beta Tester
      description: Get a list of apps that a beta tester can test.
      tags:
        - Beta Testers
        - Apps
      externalDocs:
        url: https://developer.apple.com/documentation/appstoreconnectapi/list-all-apps-for-a-beta-tester
      parameters:
        - $ref: '#/components/parameters/BetaTesterIdParam'
        - name: fields[apps]
          in: query
          description: Fields to return for app resources
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of apps for the beta tester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/betaTesters/{id}/builds:
    get:
      operationId: listBetaTesterBuilds
