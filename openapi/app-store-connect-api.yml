components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App Store Connect API uses JSON Web Tokens (JWT) for authentication.
        Generate a token using your API key from App Store Connect. The token
        must include the issuer ID, key ID, and be signed with the ES256
        algorithm using your private key. Tokens expire after 20 minutes.

  parameters:
    AppIdParam:
      name: id
      in: path
      required: true
      description: The unique identifier for the app resource
      schema:
        type: string
    BuildIdParam:
      name: id
      in: path
      required: true
      description: The unique identifier for the build resource
      schema:
        type: string
    BetaTesterIdParam:
      name: id
      in: path
      required: true
      description: The unique identifier for the beta tester resource
      schema:
        type: string
    BetaGroupIdParam:
      name: id
      in: path
      required: true
      description: The unique identifier for the beta group resource
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of resources to return (maximum 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    # --- Resource Identity ---
    ResourceLink:
      type: object
      properties:
        self:
          type: string
          format: uri
          description: The URL for the resource

    PagedDocumentLinks:
      type: object
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          description: The URL for the current page of results
        first:
          type: string
          format: uri
          description: The URL for the first page of results
        next:
          type: string
          format: uri
          description: The URL for the next page of results

    DocumentLinks:
      type: object
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          description: The URL for the resource

    PagingInformation:
      type: object
      required:
        - paging
      properties:
        paging:
          type: object
          required:
            - total
            - limit
          properties:
            total:
              type: integer
              description: Total number of resources matching the request
            limit:
              type: integer
              description: Maximum number of resources returned per page

    RelationshipLinks:
      type: object
      properties:
        self:
          type: string
          format: uri
        related:
          type: string
          format: uri

    RelationshipData:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string

    # --- Error ---
    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - status
        - title
      properties:
        id:
          type: string
          description: A unique identifier for this error occurrence
        status:
          type: string
          description: The HTTP status code for this error
        code:
          type: string
          description: A machine-readable error code
        title:
          type: string
          description: A short summary of the error
        detail:
          type: string
          description: A detailed explanation of the error
        source:
          type: object
          properties:
            pointer:
              type: string
              description: JSON pointer to the associated entity in the request body
            parameter:
              type: string
              description: The query parameter that caused the error

    # --- App Resource ---
    App:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - apps
        id:
          type: string
          description: The opaque resource ID that uniquely identifies the app
        attributes:
          $ref: '#/components/schemas/AppAttributes'
        relationships:
          $ref: '#/components/schemas/AppRelationships'
        links:
          $ref: '#/components/schemas/ResourceLink'

    AppAttributes:
      type: object
      properties:
        name:
          type: string
          description: The name of the app
        bundleId:
          type: string
          description: The bundle ID of the app
        sku:
          type: string
          description: The SKU of the app
        primaryLocale:
          type: string
          description: The primary locale for the app (e.g., en-US)
        isOrEverWasMadeForKids:
          type: boolean
          description: Whether the app is or was made for kids
        contentRightsDeclaration:
          type: string
          enum:
            - DOES_NOT_USE_THIRD_PARTY_CONTENT
            - USES_THIRD_PARTY_CONTENT
          description: Declaration of whether the app uses third-party content
        streamlinedPurchasingEnabled:
          type: boolean
          description: Whether streamlined purchasing is enabled
        subscriptionStatusUrl:
          type:
            - string
            - 'null'
          format: uri
          description: URL for subscription status notifications
        subscriptionStatusUrlForSandbox:
          type:
            - string
            - 'null'
          format: uri
          description: URL for sandbox subscription status notifications
        subscriptionStatusUrlVersion:
          type:
            - string
            - 'null'
          enum:
            - V1
            - V2
            - null
          description: Version of the subscription status URL
        subscriptionStatusUrlVersionForSandbox:
          type:
            - string
            - 'null'
          enum:
            - V1
            - V2
            - null
          description: Version of the sandbox subscription status URL

    AppRelationships:
      type: object
      properties:
        builds:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        betaGroups:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        betaTesters:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
        appStoreVersions:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        preReleaseVersions:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        appInfos:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'

    AppResponse:
      type: object
      required:
        - data
        - links
      properties:
        data:
          $ref: '#/components/schemas/App'
        included:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/DocumentLinks'

    AppsResponse:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/App'
        included:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'

    AppUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - apps
            id:
              type: string
            attributes:
              type: object
              properties:
                contentRightsDeclaration:
                  type: string
                  enum:
                    - DOES_NOT_USE_THIRD_PARTY_CONTENT
                    - USES_THIRD_PARTY_CONTENT
                subscriptionStatusUrl:
                  type:
                    - string
                    - 'null'
                  format: uri
                subscriptionStatusUrlForSandbox:
                  type:
                    - string
                    - 'null'
                  format: uri
                subscriptionStatusUrlVersion:
                  type:
                    - string
                    - 'null'
                  enum:
                    - V1
                    - V2
                    - null
                subscriptionStatusUrlVersionForSandbox:
                  type:
                    - string
                    - 'null'
                  enum:
                    - V1
                    - V2
                    - null

    # --- Build Resource ---
    Build:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - builds
        id:
          type: string
          description: The opaque resource ID that uniquely identifies the build
        attributes:
          $ref: '#/components/schemas/BuildAttributes'
        relationships:
          $ref: '#/components/schemas/BuildRelationships'
        links:
          $ref: '#/components/schemas/ResourceLink'

    BuildAttributes:
      type: object
      properties:
        version:
          type: string
          description: The build version string (CFBundleVersion)
        uploadedDate:
          type: string
          format: date-time
          description: The date and time the build was uploaded
        expirationDate:
          type: string
          format: date-time
          description: The date and time the build expires
        expired:
          type: boolean
          description: Whether the build has expired
        minOsVersion:
          type: string
          description: The minimum OS version required
        lsMinimumSystemVersion:
          type: string
          description: The minimum macOS system version
        computedMinMacOsVersion:
          type: string
          description: The computed minimum macOS version
        iconAssetToken:
          type: object
          description: Token for the build's icon asset
          properties:
            templateUrl:
              type: string
            width:
              type: integer
            height:
              type: integer
        processingState:
          type: string
          enum:
            - PROCESSING
            - FAILED
            - INVALID
            - VALID
          description: The processing state of the build
        buildAudienceType:
          type: string
          enum:
            - INTERNAL_ONLY
            - APP_STORE_ELIGIBLE
          description: The audience type for the build
        usesNonExemptEncryption:
          type:
            - boolean
            - 'null'
          description: Whether the build uses non-exempt encryption

    BuildRelationships:
      type: object
      properties:
        app:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'
        preReleaseVersion:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'
        individualTesters:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        betaGroups:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        betaBuildLocalizations:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipData'
        appEncryptionDeclaration:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'
        betaAppReviewSubmission:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'
        buildBetaDetail:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'
        appStoreVersion:
          type: object
          properties:
            links:
              $ref: '#/components/schemas/RelationshipLinks'
            data:
              $ref: '#/components/schemas/RelationshipData'

    BuildResponse:
      type: object
      required:
        - data
        - links
      properties:
        data:
          $ref: '#/components/schemas/Build'
        included:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/DocumentLinks'

    BuildsResponse:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Build'
        included:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'

    BuildUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - builds
            id:
              type: string
            attributes:
              type: object
              properties:
                expired:
                  type: boolean
                  description: Set to true to expire the build
                usesNonExemptEncryption:
                  type: boolean
                  description: Whether the build uses non-exempt encryption

    # --- Beta Tester Resource ---
    BetaTester:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - betaTesters
        id:
          type: string
          description: The opaque resource ID that uniquely identifies the beta tester
        attributes:
          $ref: '#/components/schemas/BetaTesterAttributes'
        relationships:
          $ref: '#/components/schemas/BetaTesterRelationships'
        links:
          $ref: '#/components/schemas/ResourceLink'

    BetaTesterAttributes:
      type: object
      properties:
        firstName:
          type:
            - string
            - 'null'
          description: The first name of the beta tester
        lastName:
          type:
            - string
            - 'null'
          description: The last name of the beta tester
        email:
          type:
            - string
            - 'null'
          format: email
          description: The email address of the beta tester
        inviteType:
          type: string
          enum:
            - EMAIL
            - PUBLIC_LINK
          description: How the tester was invited
        state:
          type: string
          enum:
            - NOT_INVITED
            - INVITED
            - ACCEPTED
            - INSTALLED
            - REVOKED
          description: The current state of the beta tester invitation

    BetaTesterRelationships:
      type: object
      properties:
        apps:
